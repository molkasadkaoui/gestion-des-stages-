<div class="home-container">
  <div class="home-content">
    <div class="home-logo-wrap">
      <img src="/logo-poste.webp" alt="La Poste Tunisienne" class="home-logo">
    </div>

    <h1 class="home-title">{{ 'NAV.TITLE' | translate }}</h1>
    <p class="home-subtitle">{{ 'HOME.SUBTITLE' | translate }}</p>
    <p class="home-tagline">{{ 'HOME.TAGLINE' | translate }}</p>

    <div class="home-actions">
      <a mat-raised-button color="primary" routerLink="/login" class="home-btn">{{ 'HOME.LOGIN_BTN' | translate }}</a>
      <a mat-stroked-button routerLink="/register" class="home-btn home-btn-outline">{{ 'HOME.REGISTER_BTN' | translate }}</a>
    </div>
  </div>
</div>
