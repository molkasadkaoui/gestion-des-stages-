<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Connexion</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="credentials.email" required>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" name="motDePasse" [(ngModel)]="credentials.motDePasse" required>
        </mat-form-field>

        @if (error) {
          <p class="error">{{ error }}</p>
        }

        <button mat-raised-button color="primary" type="submit" [disabled]="!loginForm.valid || loading" class="full-width">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>

      <p class="link-text">
        Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
